<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>✨ Luminous Diwali ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-text-color: #f40;
            --neon-border-color: #08f;
            --bulb-glow: #ff9933;
            --bulb-shadow: rgba(255, 153, 51, 0.8);
        }

        body {
            background-color: #000;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        /* Dynamic Light Strips */
        .light-strip {
            position: fixed;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--bulb-glow), 
                transparent);
            animation: lightMove 3s linear infinite;
            opacity: 0.5;
            filter: blur(2px);
        }

        @keyframes lightMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Main Container */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Neon Text Effect */
        .wishes {
            position: relative;
            transform-style: preserve-3d;
            animation: floatText 5s ease-in-out infinite;
        }

        .neon-text {
            font-size: 6rem;
            font-weight: bold;
            text-align: center;
            color: #fff;
            text-shadow: 
                0 0 5px var(--neon-text-color),
                0 0 10px var(--neon-text-color),
                0 0 20px var(--neon-text-color),
                0 0 40px var(--neon-text-color);
            animation: textFlicker 3s infinite alternate;
        }

        .script-text {
            font-family: 'Great Vibes', cursive;
            font-size: 8rem;
            margin-top: -20px;
            background: linear-gradient(45deg, #ff9933, #ff3366, #9933ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientFlow 8s linear infinite;
            background-size: 200% auto;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes textFlicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% {
                opacity: 0.99;
                text-shadow: 
                    0 0 5px var(--neon-text-color),
                    0 0 10px var(--neon-text-color),
                    0 0 20px var(--neon-text-color),
                    0 0 40px var(--neon-text-color);
            }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% {
                opacity: 0.4;
                text-shadow: none;
            }
        }

        /* Glowing Bulb Array */
        .bulb-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .bulb {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, white, var(--bulb-glow));
            box-shadow: 
                0 0 10px var(--bulb-shadow),
                0 0 20px var(--bulb-shadow),
                0 0 30px var(--bulb-shadow),
                0 0 40px var(--bulb-shadow);
            animation: bulbPulse 2s infinite;
        }

        @keyframes bulbPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        /* Interactive Diya */
        .diya-3d {
            position: absolute;
            bottom: 15%;
            transform-style: preserve-3d;
            animation: diyaFloat 4s ease-in-out infinite;
        }

        .diya-body {
            width: 200px;
            height: 80px;
            background: linear-gradient(45deg, #cd853f, #deb887);
            border-radius: 0 0 100px 100px;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .flame-3d {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 120px;
            animation: flameFlicker 3s infinite;
        }

        .flame-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                rgba(255, 255, 255, 0.9) 0%,
                rgba(255, 153, 51, 0.9) 30%,
                rgba(255, 51, 0, 0.7) 60%,
                transparent 100%
            );
            border-radius: 50% 50% 20% 20%;
            filter: blur(5px);
            transform-style: preserve-3d;
        }

        @keyframes flameFlicker {
            0%, 100% { transform: translateX(-50%) scale(1) rotate(-2deg); }
            25% { transform: translateX(-50%) scale(1.1) rotate(2deg); }
            50% { transform: translateX(-50%) scale(0.9) rotate(-1deg); }
            75% { transform: translateX(-50%) scale(1.2) rotate(1deg); }
        }

        /* Dynamic Light Rays */
        .light-rays {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                repeating-conic-gradient(
                    from 0deg,
                    transparent 0deg,
                    rgba(255, 153, 51, 0.1) 10deg,
                    transparent 20deg
                );
            animation: raysRotate 20s linear infinite;
        }

        @keyframes raysRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Sparks Effect */
        .sparks {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .spark {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: sparkFly 2s linear infinite;
        }

        @keyframes sparkFly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x, 100px), var(--y, -100px)) scale(0);
                opacity: 0;
            }
        }

        /* Interactive Elements */
        .interactive-area {
            position: absolute;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes diyaFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <div class="light-rays"></div>
    <div id="tsparticles"></div>
    
    <!-- Dynamic Light Strips -->
    <div class="light-strip" style="top: 20%"></div>
    <div class="light-strip" style="top: 40%"></div>
    <div class="light-strip" style="top: 60%"></div>
    <div class="light-strip" style="top: 80%"></div>

    <div class="container">
        <div class="wishes">
            <h1 class="neon-text">HAPPY</h1>
            <h2 class="script-text">Diwali</h2>
        </div>

        <div class="diya-3d">
            <div class="diya-body">
                <div class="flame-3d">
                    <div class="flame-inner"></div>
                </div>
            </div>
        </div>

        <div class="bulb-container"></div>
        <div class="sparks"></div>
        <div class="interactive-area"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3/tsparticles.bundle.min.js"></script>
    <script>
        // Create dynamic bulbs
        function createBulbs() {
            const container = document.querySelector('.bulb-container');
            const radius = Math.min(window.innerWidth, window.innerHeight) * 0.4;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            for (let i = 0; i < 24; i++) {
                const angle = (i / 24) * Math.PI * 2;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                
                const bulb = document.createElement('div');
                bulb.className = 'bulb';
                bulb.style.left = `${x}px`;
                bulb.style.top = `${y}px`;
                bulb.style.animationDelay = `${i * 0.1}s`;
                container.appendChild(bulb);
            }
        }

        // Create sparks
        function createSpark(x, y) {
            const sparksContainer = document.querySelector('.sparks');
            const spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = `${x}px`;
            spark.style.top = `${y}px`;
            spark.style.setProperty('--x', `${Math.random() * 200 - 100}px`);
            spark.style.setProperty('--y', `${Math.random() * -200 - 50}px`);
            sparksContainer.appendChild(spark);
            
            setTimeout(() => spark.remove(), 2000);
        }

        // Interactive area handler
        function setupInteractiveArea() {
            const area = document.querySelector('.interactive-area');
            area.addEventListener('mousemove', (e) => {
                if (Math.random() > 0.8) {
                    createSpark(e.clientX, e.clientY);
                }
            });
            
            area.addEventListener('click', (e) => {
                for (let i = 0; i < 10; i++) {
                    setTimeout(() => createSpark(e.clientX, e.clientY), i * 50);
                }
            });
        }

        // Particle configuration
        async function loadParticles(options) {
            await tsParticles.load({ id: "tsparticles", options });
        }

        const configs = {
            fullScreen: {
                enable: true,
                zIndex: -1
            },
            particles: {
                number: {
                    value: 80,
                    density: {
                        enable: true,
                        value_area: 800
                    }
                },
                color: {
                    value: ["#ff9933", "#ff3366", "#9933ff"]
                },
                shape: {
                    type: "circle"
                },
                opacity: {
                    value: 0.5,
                    random: true,
                    animation: {
                        enable: true,
                        speed: 1,
                        minimumValue: 0.1,
                        sync: false
                    }
                },
                size: {
                    value: 3,
                    random: true,
                    animation: {
                        enable: true,
                        speed: 2,
                        minimumValue: 0.5,
                        sync: false
                    }
                },
                move: {
                    enable: true,
                    speed: 1,
                    direction: "none",
                    random: true,
                    straight: false,
                    outModes: {
                        default: "bounce"
                    },
                    attract: {
                        enable: true,
                        rotateX: 600,
                        rotateY: 1200
                    }
                }
            },
            interactivity: {
                detectsOn: "window",
                events: {
                    onHover: {
                        enable: true,
                        mode: "grab"
                    },
                    onClick: {
                        enable: true,
                        mode: "push"
                    },
                    resize: true
                },
                modes: {
                    grab: {
                        distance: 140,
                        links: {
                            opacity: 0.5
                        }
                    },
                    push: {
                        particles_nb: 4
                    }
                }
            },
            retina_detect: true
        };

        // Initialize everything
        window.addEventListener('DOMContentLoaded', () => {
            loadParticles(configs);
            createBulbs();
            setupInteractiveArea();

            // Create initial sparks
            setInterval(() => {
                const x = Math.random() * window.innerWidth;
                const y = window.innerHeight;
                createSpark(x, y);
            }, 200);
        });
    </script>
</body>
</html>
